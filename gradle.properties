org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin 1.9.x cannot start on the system's Java 26 runtime. Keep Gradle on
# the installed Java 21 LTS runtime so plain ./gradlew commands work in every
# session without a shell-specific JAVA_HOME override.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
android.useAndroidX=true
kotlin.code.style=official
